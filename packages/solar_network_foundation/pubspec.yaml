name: solar_network_foundation
description: "Reusable presentation primitives and the shared cloud drive service for Solar Network clients."
version: 0.1.0
publish_to: none

environment:
  sdk: '>3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # In-repo Solar Network packages.
  island_ui_foundation:
    path: ../island_ui_foundation
  solar_network_sdk:
    path: ../solar_network_sdk

  # Presentation primitives.
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  markdown: ^7.3.1
  flutter_markdown_plus: ^1.0.12
  material_symbols_icons: ^4.2960.0
  material_ui: ">=1.3.0 <2.0.0"
  gap: ^3.0.1
  easy_localization: ^3.0.8

  # State.
  flutter_riverpod: ">=3.3.2 <4.0.0"
  riverpod_annotation: ">=4.0.3 <5.0.0"

  # Drive service.
  dio: ^5.11.1
  crypto: ^3.0.7
  convert: ^3.1.2
  collection: ^1.19.1
  cross_file: ">=0.3.5 <0.4.0"
  http_parser: ^4.1.2
  mime: ^2.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_cache_manager: ^3.4.5
  file_picker: ">=11.0.0 <14.0.0"
  file_saver: ">=0.4.0 <0.7.0"
  gal: ^2.3.3
  image: ^4.10.1
  native_exif: ^0.8.0
  video_thumbnail: ^0.5.6
  flutter_image_compress: ^2.5.1
  media_kit: ^1.2.6
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ">=2.15.1 <3.0.0"
  riverpod_generator: ">=4.0.4 <5.0.0"

flutter:
