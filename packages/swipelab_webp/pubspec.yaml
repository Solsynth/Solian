name: swipelab_webp
description: >-
  High-performance WebP image encoding for Dart using native libwebp via FFI.
  Supports both lossy and lossless compression with configurable quality.
version: 1.0.0
repository: https://github.com/swipelab/swipelab_webp
issue_tracker: https://github.com/swipelab/swipelab_webp/issues

environment:
  sdk: ^3.10.0

topics:
  - image
  - webp
  - encoding
  - compression
  - ffi

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  ffi: ^2.1.3
  # Required for hook/build.dart
  hooks: ^1.0.0
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.0
  logging: ^1.3.0
