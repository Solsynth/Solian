org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.47's Gradle plugin still relies on the legacy AGP DSL, and most
# Flutter plugins still apply the Kotlin Gradle plugin, so keep AGP's
# built-in Kotlin/KGP compatibility mode until the ecosystem migrates.
android.newDsl=false
android.builtInKotlin=false
