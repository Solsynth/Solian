name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the exported IPA to App Store Connect
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'ios-v*'

# Required repository secrets:
#   APPLE_TEAM_ID
#   IOS_APP_STORE_CERTIFICATE_P12_BASE64
#   IOS_APP_STORE_CERTIFICATE_PASSWORD
#   IOS_APP_STORE_SIGNING_IDENTITY
#   IOS_APP_STORE_MAIN_PROVISIONING_PROFILE_BASE64
#   IOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64
#   IOS_APP_STORE_WATCH_PROVISIONING_PROFILE_BASE64
#   IOS_APP_STORE_BROADCAST_PROVISIONING_PROFILE_BASE64
#   IOS_APP_STORE_SHARE_PROVISIONING_PROFILE_BASE64
#   IOS_APP_STORE_NOTIFICATION_PROVISIONING_PROFILE_BASE64
#   ASC_KEY_ID
#   ASC_ISSUER_ID
#   ASC_API_KEY_P8_BASE64

permissions:
  contents: read

concurrency:
  group: ios-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_APP_STORE_SIGNING_IDENTITY: ${{ secrets.IOS_APP_STORE_SIGNING_IDENTITY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Print build tool versions
        run: |
          xcodebuild -version
          flutter --version
          rustup run stable rustc --version

      - name: Resolve Flutter packages
        run: flutter pub get

      # Cargokit invokes Cargo from an Xcode script phase. Remove Apple
      # deployment variables because Rust 1.97 plus the old proc-macro-error
      # dependency otherwise fails to load proc_macro_error_attr.
      - name: Patch Cargokit Rust environment
        shell: python
        run: |
          from pathlib import Path

          marker = (
              "unset MACOSX_DEPLOYMENT_TARGET "
              "IPHONEOS_DEPLOYMENT_TARGET WATCHOS_DEPLOYMENT_TARGET"
          )
          scripts = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/super_native_extensions-*/cargokit/build_pod.sh"
          ))
          if not scripts:
              raise SystemExit("super_native_extensions Cargokit script was not found")

          for script in scripts:
              content = script.read_text()
              if marker not in content:
                  old_marker = "unset MACOSX_DEPLOYMENT_TARGET"
                  if old_marker in content:
                      content = content.replace(old_marker, marker, 1)
                  else:
                      needle = "export PATH=${NEW_PATH%?} # remove trailing :"
                      if needle not in content:
                          raise SystemExit(f"Unexpected Cargokit script format: {script}")
                      content = content.replace(needle, needle + "\n" + marker, 1)
                  script.write_text(content)
              print(f"Using Cargokit workaround: {script}")

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Import iOS signing certificate
        env:
          IOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
          IOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$IOS_APP_STORE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_APP_STORE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install iOS provisioning profiles
        env:
          IOS_MAIN_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_MAIN_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          IOS_WATCH_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_WATCH_PROVISIONING_PROFILE_BASE64 }}
          IOS_BROADCAST_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_BROADCAST_PROVISIONING_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_SHARE_PROVISIONING_PROFILE_BASE64 }}
          IOS_NOTIFICATION_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_NOTIFICATION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          install_profile() {
            local key="$1"
            local encoded="$2"
            local profile_path="$RUNNER_TEMP/${key}.mobileprovision"
            local profile_plist="$RUNNER_TEMP/${key}.plist"

            if [ -z "$encoded" ]; then
              echo "Missing provisioning profile secret for $key" >&2
              exit 1
            fi

            printf '%s' "$encoded" | base64 -D > "$profile_path"
            security cms -D -i "$profile_path" > "$profile_plist"
            local uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")
            local name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")

            cp "$profile_path" "$PROFILE_DIR/$uuid.mobileprovision"
            echo "${key}_NAME=$name" >> "$GITHUB_ENV"
          }

          install_profile IOS_MAIN_PROFILE "$IOS_MAIN_PROFILE_BASE64"
          install_profile IOS_WIDGET_PROFILE "$IOS_WIDGET_PROFILE_BASE64"
          install_profile IOS_WATCH_PROFILE "$IOS_WATCH_PROFILE_BASE64"
          install_profile IOS_BROADCAST_PROFILE "$IOS_BROADCAST_PROFILE_BASE64"
          install_profile IOS_SHARE_PROFILE "$IOS_SHARE_PROFILE_BASE64"
          install_profile IOS_NOTIFICATION_PROFILE "$IOS_NOTIFICATION_PROFILE_BASE64"

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Solian.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$IOS_APP_STORE_SIGNING_IDENTITY"

      - name: Export App Store IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.solsynth.solian</key>
              <string>${IOS_MAIN_PROFILE_NAME}</string>
              <key>dev.solsynth.solian.SolianWidgetExtension</key>
              <string>${IOS_WIDGET_PROFILE_NAME}</string>
              <key>dev.solsynth.solian.watchkitapp</key>
              <string>${IOS_WATCH_PROFILE_NAME}</string>
              <key>dev.solsynth.solian.SolianBroadcastExtension</key>
              <string>${IOS_BROADCAST_PROFILE_NAME}</string>
              <key>dev.solsynth.solian.SolianShareExtension</key>
              <string>${IOS_SHARE_PROFILE_NAME}</string>
              <key>dev.solsynth.solian.SolianNotificationService</key>
              <string>${IOS_NOTIFICATION_PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solian.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload exported IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solian-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Prepare App Store Connect API key
        if: github.event_name == 'push' || inputs.upload == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D \
            > "$API_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to App Store Connect
        if: github.event_name == 'push' || inputs.upload == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo 'No iOS IPA was exported' >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"
