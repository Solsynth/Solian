name: macOS App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the exported package to App Store Connect
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

# Required repository secrets:
#   APPLE_TEAM_ID
# macOS-specific signing:
#   MACOS_APP_STORE_CERTIFICATE_P12_BASE64
#   MACOS_APP_STORE_CERTIFICATE_PASSWORD
#   MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64
#   MACOS_APP_STORE_SIGNING_IDENTITY
# A temporary keychain password is generated for each runner.
# Shared App Store Connect secrets:
#   APPLE_TEAM_ID
#   ASC_KEY_ID
#   ASC_ISSUER_ID
#   ASC_API_KEY_P8_BASE64

permissions:
  contents: read

concurrency:
  group: macos-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: dev.solsynth.solian
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_APP_STORE_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_STORE_SIGNING_IDENTITY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Print build tool versions
        run: |
          xcodebuild -version
          flutter --version
          rustup run stable rustc --version

      - name: Resolve Flutter packages
        run: flutter pub get

      # Xcode exports MACOSX_DEPLOYMENT_TARGET to CocoaPods script phases.
      # Rust 1.97 plus Cargokit in super_native_extensions 0.9.1 fails to
      # load proc_macro_error_attr when that variable is present.
      - name: Patch Cargokit Rust environment
        shell: python
        run: |
          from pathlib import Path

          marker = "unset MACOSX_DEPLOYMENT_TARGET"
          scripts = list(Path.home().glob(
              ".pub-cache/hosted/pub.dev/super_native_extensions-*/cargokit/build_pod.sh"
          ))
          if not scripts:
              raise SystemExit("super_native_extensions Cargokit script was not found")

          for script in scripts:
              content = script.read_text()
              if marker not in content:
                  needle = "export PATH=${NEW_PATH%?} # remove trailing :"
                  if needle not in content:
                      raise SystemExit(f"Unexpected Cargokit script format: {script}")
                  script.write_text(content.replace(needle, needle + "\n" + marker, 1))
              print(f"Using Cargokit workaround: {script}")

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=macos

      - name: Import macOS signing certificate
        env:
          MACOS_APP_STORE_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_P12_BASE64 }}
          MACOS_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APP_STORE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macos-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_APP_STORE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_APP_STORE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Install macOS provisioning profile
        env:
          MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/macos.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/macos-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$MACOS_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.provisionprofile"
          echo "MACOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive macOS app
        run: |
          xcodebuild archive \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Solian.xcarchive" \
            -destination 'generic/platform=macOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_APP_STORE_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$MACOS_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID"

      - name: Export App Store package
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${MACOS_PROFILE_NAME}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solian.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload exported package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solian-macos-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.pkg
          if-no-files-found: error

      - name: Prepare App Store Connect API key
        if: github.event_name == 'push' || inputs.upload == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D \
            > "$API_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to App Store Connect
        if: github.event_name == 'push' || inputs.upload == true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          PACKAGE_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.pkg' -print -quit)
          if [ -z "$PACKAGE_PATH" ]; then
            echo 'No macOS package was exported' >&2
            exit 1
          fi

          xcrun altool \
            --upload-app \
            -f "$PACKAGE_PATH" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID"
